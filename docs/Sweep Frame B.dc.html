<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #0b0810; }
    a { color: #F2A65A; } a:hover { color: #FFD7A8; }
    @keyframes wig { 0%,100% { transform: rotate(-1.1deg); } 50% { transform: rotate(1.1deg); } }
  </style>
  <script src="https://unpkg.com/lucide@0.451.0/dist/umd/lucide.js"></script>
</helmet>

<div style="position:relative;width:1100px;height:740px;background:#120C1C;overflow:hidden;font-family:'Antonio',sans-serif">

  <div style="position:absolute;left:0;top:0;right:0;height:84px;background:#F2A65A;border-radius:56px 56px 0 0"></div>
  <div style="position:absolute;left:136px;top:0;width:4px;height:84px;background:#120C1C"></div>
  <div style="position:absolute;left:140px;bottom:9px;font:700 34px/1 'Antonio',sans-serif;letter-spacing:.05em;color:#1B0E24;text-transform:uppercase">Exterior View</div>
  <div style="position:absolute;left:12px;bottom:9px;width:120px;font:500 12px/1 'JetBrains Mono',monospace;color:#2B1030">{{ platePrime }}</div>
  <div style="position:absolute;right:0;top:0;width:132px;height:84px;background:#C5678D"></div>
  <div style="position:absolute;right:136px;top:0;width:4px;height:84px;background:#120C1C"></div>

  <div style="position:absolute;left:132px;top:84px;width:64px;height:64px;background:#F2A65A"></div>
  <div style="position:absolute;left:132px;top:84px;width:64px;height:64px;background:#120C1C;border-radius:64px 0 0 0"></div>
  <div style="position:absolute;right:132px;top:84px;width:64px;height:64px;background:#C5678D"></div>
  <div style="position:absolute;right:132px;top:84px;width:64px;height:64px;background:#120C1C;border-radius:0 64px 0 0"></div>
  <div style="position:absolute;left:132px;bottom:66px;width:64px;height:64px;background:#3D1F5C"></div>
  <div style="position:absolute;left:132px;bottom:66px;width:64px;height:64px;background:#120C1C;border-radius:0 0 0 64px"></div>
  <div style="position:absolute;right:132px;bottom:66px;width:64px;height:64px;background:#3D1F5C"></div>
  <div style="position:absolute;right:132px;bottom:66px;width:64px;height:64px;background:#120C1C;border-radius:0 0 64px 0"></div>

  <div style="position:absolute;left:0;top:84px;width:132px;bottom:66px;display:flex;flex-direction:column;gap:4px">
    <sc-for list="{{ segs }}" as="g" hint-placeholder-count="8">
      <div onClick="{{ g.pick }}" style="{{ g.style }}">
        <span style="{{ g.codeStyle }}">{{ g.code }}</span>
        <span style="font:inherit;letter-spacing:inherit">{{ g.label }}</span>
      </div>
    </sc-for>
  </div>

  <div onMouseDown="{{ holdStart }}" onMouseUp="{{ holdEnd }}" onMouseLeave="{{ holdEnd }}" style="{{ colStyle }}">
    <sc-for list="{{ col }}" as="b" hint-placeholder-count="6">
      <div onClick="{{ b.press }}" style="{{ b.style }}">
        <i data-lucide="{{ b.icon }}" style="width:19px;height:19px"></i>
        <span style="font:600 9.5px/1 'Antonio',sans-serif;letter-spacing:.12em;text-align:center">{{ b.label }}</span>
        <sc-if value="{{ b.badge }}" hint-placeholder-val="{{ false }}">
          <span onClick="{{ b.remove }}" style="position:absolute;right:3px;top:3px;width:17px;height:17px;border-radius:9px;background:#CF6679;color:#2A0A0F;font:700 12px/17px 'Antonio',sans-serif;text-align:center;cursor:pointer">&minus;</span>
        </sc-if>
      </div>
    </sc-for>
    <sc-if value="{{ editing }}" hint-placeholder-val="{{ false }}">
      <div onClick="{{ addCol }}" style="flex:none;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#241338;border:2px dashed #4D2F5C;color:#D0B3E6;cursor:pointer">
        <span style="font:400 20px/1 'Antonio',sans-serif">+</span>
      </div>
    </sc-if>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:66px;background:#3D1F5C;border-radius:0 0 56px 56px;display:flex;align-items:stretch;gap:4px;padding:0 0 0 0;overflow:hidden">
    <div style="width:132px;display:flex;align-items:center;padding:0 0 0 16px;font:500 11px/1.4 'JetBrains Mono',monospace;color:#D0B3E6">{{ plateB }}</div>
    <div style="flex:1;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#1C132A;font:500 12px/1 'JetBrains Mono',monospace;letter-spacing:.06em;color:#D0B3E6">
      <span style="color:#F3E9FF">{{ statusLine }}</span>
      <span>{{ tail }}</span>
    </div>
    <div onMouseDown="{{ holdStart }}" onMouseUp="{{ holdEnd }}" onMouseLeave="{{ holdEnd }}" style="{{ dockStyle }}">
      <sc-for list="{{ dock }}" as="b" hint-placeholder-count="4">
        <div onClick="{{ b.press }}" style="{{ b.style }}">
          <i data-lucide="{{ b.icon }}" style="width:18px;height:18px"></i>
          <span style="font:600 9.5px/1 'Antonio',sans-serif;letter-spacing:.12em">{{ b.label }}</span>
          <sc-if value="{{ b.badge }}" hint-placeholder-val="{{ false }}">
            <span onClick="{{ b.remove }}" style="position:absolute;right:2px;top:2px;width:17px;height:17px;border-radius:9px;background:#CF6679;color:#2A0A0F;font:700 12px/17px 'Antonio',sans-serif;text-align:center;cursor:pointer">&minus;</span>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position:absolute;left:136px;top:88px;right:136px;bottom:70px;border-radius:60px;overflow:hidden;background:linear-gradient(180deg,#3D1F5C 0%,#241338 46%,#1C132A 46%,#120C1C 100%)">
    <div style="position:absolute;left:0;right:0;top:38%;height:12%;background:linear-gradient(180deg,rgba(164,133,247,.22),transparent)"></div>
    <div style="position:absolute;left:-40px;bottom:32%;width:420px;height:120px;background:#1a1029;clip-path:polygon(0 100%,14% 38%,31% 62%,52% 12%,74% 54%,100% 30%,100% 100%)"></div>
    <div style="position:absolute;right:-30px;bottom:34%;width:380px;height:96px;background:#170e24;clip-path:polygon(0 100%,18% 44%,44% 70%,68% 22%,100% 58%,100% 100%)"></div>
    <div style="position:absolute;left:50%;top:55%;width:14px;height:34px;margin-left:-7px;background:#F2A65A;border-radius:7px"></div>
    <div style="position:absolute;left:50%;top:55%;width:64px;height:10px;margin:26px 0 0 -32px;background:rgba(0,0,0,.38);border-radius:50%"></div>

    <sc-if value="{{ padOpen }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;left:46px;bottom:34px;display:flex;align-items:flex-start;gap:4px">
        <div style="display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px">
          <sc-for list="{{ pad }}" as="p" hint-placeholder-count="9">
            <div onMouseDown="{{ p.down }}" onMouseUp="{{ p.up }}" onMouseLeave="{{ p.up }}" style="{{ p.style }}">
              <sc-if value="{{ p.icon }}" hint-placeholder-val="{{ true }}"><i data-lucide="{{ p.icon }}" style="width:20px;height:20px"></i></sc-if>
            </div>
          </sc-for>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px">
          <div onMouseDown="{{ upDown }}" onMouseUp="{{ padRelease }}" onMouseLeave="{{ padRelease }}" style="{{ flyUpStyle }}">UP</div>
          <div onMouseDown="{{ dnDown }}" onMouseUp="{{ padRelease }}" onMouseLeave="{{ padRelease }}" style="{{ flyDnStyle }}">DN</div>
          <div onClick="{{ togglePad }}" style="{{ padHideStyle }}">HIDE</div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ padClosed }}" hint-placeholder-val="{{ false }}">
      <div onClick="{{ togglePad }}" style="position:absolute;left:46px;bottom:34px;display:flex;align-items:stretch;gap:4px;height:36px;cursor:pointer">
        <span style="width:36px;background:#C5678D;border-radius:18px 0 0 18px"></span>
        <span style="display:flex;align-items:center;padding:0 16px;background:#3D1F5C;color:#F3E9FF;font:700 12px/1 'Antonio',sans-serif;letter-spacing:.16em">MOVE PAD</span>
      </div>
    </sc-if>

    <div style="position:absolute;left:56px;top:24px;display:flex;align-items:stretch;gap:4px;height:26px">
      <span style="width:34px;background:#C5678D;border-radius:13px 0 0 13px"></span>
      <span style="display:flex;align-items:center;padding:0 12px;background:#1C132A;font:500 12px/1 'JetBrains Mono',monospace;letter-spacing:.1em;color:#D0B3E6">HELIOTROPE · 128,64,42</span>
    </div>

    <div style="position:absolute;right:48px;top:24px;width:206px;background:#1C132A;overflow:hidden">
      <div style="display:flex;align-items:stretch;gap:4px;height:26px">
        <span style="flex:1;display:flex;align-items:center;padding:0 10px;background:#A485F7;font:700 12px/1 'Antonio',sans-serif;letter-spacing:.16em;color:#170F2E">TARGET LOCK</span>
        <span style="width:42px;display:flex;align-items:center;justify-content:center;background:#3D1F5C;font:500 11px/1 'JetBrains Mono',monospace;color:#F3E9FF">{{ plateC }}</span>
      </div>
      <div style="padding:11px 12px 13px">
        <div style="font:600 17px/1.1 'Antonio',sans-serif;letter-spacing:.04em;color:#F3E9FF">KIT SANDALWOOD</div>
        <div style="font:400 11px/1.5 'JetBrains Mono',monospace;color:#D0B3E6;margin-top:3px">12.4m · script 0.21ms</div>
        <div style="display:flex;flex-direction:column;gap:4px;margin-top:10px">
          <sc-for list="{{ bars }}" as="b" hint-placeholder-count="3">
            <div style="height:7px;background:#241338"><div style="{{ b.fill }}"></div></div>
          </sc-for>
        </div>
      </div>
    </div>
  </div>

  <sc-if value="{{ editing }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ endEdit }}" style="position:absolute;inset:0;background:rgba(9,6,14,.74);z-index:5"></div>
    <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;display:flex;align-items:stretch;gap:4px;height:34px">
      <span style="width:44px;background:#C5678D;border-radius:17px 0 0 17px"></span>
      <span style="display:flex;align-items:center;padding:0 16px;background:#1C132A;font:500 12px/1 'JetBrains Mono',monospace;letter-spacing:.12em;color:#D0B3E6">DOCK EDIT — MINUS REMOVES, PLUS ADDS</span>
      <span onClick="{{ endEdit }}" style="display:flex;align-items:center;padding:0 20px;background:#F2A65A;font:700 13px/1 'Antonio',sans-serif;letter-spacing:.16em;color:#1B0E24;cursor:pointer;border-radius:0 17px 17px 0">DONE</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:740}}">
const BTN = {
  fly:  { label: "FLY",     icon: "plane",           tog: true, off: "no fly in this region" },
  sit:  { label: "SIT",     icon: "armchair" },
  snap: { label: "SNAP",    icon: "camera" },
  mini: { label: "MINIMAP", icon: "map" },
  inv:  { label: "INV",     icon: "package" },
  home: { label: "HOME",    icon: "house" },
  ao:   { label: "AO",      icon: "person-standing", tog: true },
  sun:  { label: "MIDDAY",  icon: "sun",             tog: true },
  mute: { label: "MUTE",    icon: "volume-x",        tog: true },
  rgn:  { label: "REGION",  icon: "info" },
};

const SEGS = [
  { id: "world", code: "01-4471", label: "EXTERIOR", h: 94 },
  { id: "cam",   code: "01-4472", label: "CAM",      h: 30, sub: true },
  { id: "gfx",   code: "01-4473", label: "GRAPHICS", h: 30, sub: true },
  { id: "radar", code: "02-1180", label: "RADAR",    h: 56, c: "#A485F7" },
  { id: "chat",  code: "03-2290", label: "CHAT",     h: 70, c: "#C5678D" },
  { id: "inv",   code: "04-0071", label: "INVENTORY",h: 46, c: "#A485F7" },
  { id: "map",   code: "05-3310", label: "MAP",      h: 58, c: "#3D1F5C" },
  { id: "set",   code: "06-9002", label: "SETTINGS", h: 44, c: "#A485F7" },
];

const PAD = [
  { k: "tl",  icon: "rotate-ccw" },    { k: "fwd", icon: "chevron-up" },    { k: "tr", icon: "rotate-cw" },
  { k: "lft", icon: "chevron-left" },  { k: "run", icon: "gauge" },         { k: "rgt", icon: "chevron-right" },
  { k: "",    icon: "" },              { k: "bck", icon: "chevron-down" },  { k: "",    icon: "" },
];

class Component extends DCLogic {
  state = { sel: "world", edit: false, reason: "", t: 0, padOpen: true, held: "", run: false, flash: "",
            tog: { ao: true, sun: false, fly: false, mute: false },
            col: ["fly", "sit", "snap", "mini", "ao", "sun"],
            dock: ["inv", "home", "mute", "rgn"] };

  componentDidMount() { this.iv = setInterval(() => this.setState(s => ({ t: s.t + 1 })), 1000); this.ic(); }
  componentDidUpdate() { this.ic(); }
  componentWillUnmount() { clearInterval(this.iv); clearTimeout(this.lp); }
  ic() { if (window.lucide) window.lucide.createIcons(); }

  tap(id) {
    clearTimeout(this.fl);
    this.setState({ sel: id, flash: id });
    this.fl = setTimeout(() => this.setState({ flash: "" }), 200);
  }

  hold(k) {
    if (k === "run") this.setState(s => ({ run: !s.run }));
    else this.setState({ held: k });
  }

  press(k) {
    const b = BTN[k];
    if (b.off) { this.setState({ reason: "DENIED — " + b.off }); return; }
    if (b.tog) this.setState(s => ({ tog: Object.assign({}, s.tog, { [k]: !s.tog[k] }), reason: "" }));
    else this.setState({ reason: b.label + " — ACKNOWLEDGED" });
  }

  btn(k, i, where, count) {
    const s = this.state, b = BTN[k], lit = !!s.tog[k], dis = !!b.off;
    const vert = where === "col";
    return {
      key: k, label: b.label, icon: b.icon, badge: s.edit,
      press: () => this.press(k),
      remove: () => this.setState(st => ({ [where]: st[where].filter(x => x !== k) })),
      style: {
        position: "relative", display: "flex", flexDirection: "column",
        alignItems: "center", justifyContent: "center", gap: "4px",
        flex: vert ? "1 1 0" : "0 0 82px", minHeight: 0, minWidth: 0,
        background: dis ? "#241338" : (lit ? "#F2A65A" : "#3D1F5C"),
        color: dis ? "#8E7AA6" : (lit ? "#1B0E24" : "#F3E9FF"),
        cursor: dis ? "not-allowed" : "pointer",
        borderRadius: vert
          ? (i === 0 ? "0 22px 0 0" : (i === count - 1 && !s.edit ? "0 0 22px 0" : "0"))
          : (i === count - 1 ? "0 22px 22px 0" : "0"),
        animation: s.edit ? "wig .42s ease-in-out infinite" : "none",
        animationDelay: (i % 4) * 0.07 + "s",
      },
    };
  }

  renderVals() {
    const s = this.state, t = s.t;
    const pad = (n, w) => String(n).padStart(w, "0");

    const segs = SEGS.map(g => {
      const on = s.sel === g.id;
      return {
        code: g.code, label: g.label, pick: () => this.tap(g.id),
        codeStyle: { position: "absolute", left: "8px", top: "6px",
          font: "500 8.5px/1 'JetBrains Mono',monospace",
          color: on ? "rgba(27,14,36,.6)" : "rgba(243,233,255,.42)" },
        style: {
          position: "relative", flex: "none", height: g.h + "px", boxSizing: "border-box",
          width: g.sub ? "104px" : "132px", marginLeft: g.sub ? "28px" : "0",
          background: s.flash === g.id ? "#FFD7A8" : (on ? "#F2A65A" : (g.c || "#3D1F5C")), color: on ? "#1B0E24" : "#F3E9FF",
          display: "flex", alignItems: "flex-end", justifyContent: "flex-end",
          padding: "0 8px 5px 0", cursor: "pointer",
          font: "700 " + (g.sub ? 9 : 11) + "px/1 'Antonio',sans-serif", letterSpacing: ".1em",
        },
      };
    });
    segs.push({ code: "", label: "", codeStyle: { display: "none" }, pick: () => {},
      style: { flex: "1 1 auto", minHeight: "30px", background: "#4D2F5C" } });

    const fly = (k, bg) => ({ width: "64px", height: "52px", display: "flex", alignItems: "center",
      justifyContent: "center", background: s.held === k ? "#F2A65A" : bg,
      color: s.held === k ? "#1B0E24" : "#170F2E", font: "700 13px/1 'Antonio',sans-serif",
      letterSpacing: ".14em", cursor: "pointer" });

    return {
      segs, editing: s.edit,
      padOpen: s.padOpen, padClosed: !s.padOpen,
      pad: PAD.map((p, i) => p.k ? {
        icon: p.icon, down: () => this.hold(p.k), up: () => this.setState({ held: "" }),
        style: {
          display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer",
          background: (p.k === "run" ? s.run : s.held === p.k) ? "#F2A65A" : "#3D1F5C",
          color: (p.k === "run" ? s.run : s.held === p.k) ? "#1B0E24" : "#F3E9FF",
          borderRadius: i === 0 ? "26px 0 0 0" : (i === 2 ? "0 26px 0 0" : "0"),
        },
      } : { icon: "", down: () => {}, up: () => {}, style: { background: "transparent", pointerEvents: "none" } }),
      flyUpStyle: Object.assign(fly("up", "#A485F7"), { borderRadius: "0 26px 0 0" }),
      flyDnStyle: fly("dn", "#A485F7"),
      padHideStyle: { width: "64px", height: "52px", display: "flex", alignItems: "center",
        justifyContent: "center", background: "#C5678D", color: "#2B1030",
        font: "700 11px/1 'Antonio',sans-serif", letterSpacing: ".14em", cursor: "pointer",
        borderRadius: "0 0 26px 0" },
      upDown: () => this.setState({ held: "up" }),
      dnDown: () => this.setState({ held: "dn" }),
      padRelease: () => this.setState({ held: "" }),
      togglePad: () => this.setState(st => ({ padOpen: !st.padOpen })),
      col: s.col.map((k, i) => this.btn(k, i, "col", s.col.length)),
      dock: s.dock.map((k, i) => this.btn(k, i, "dock", s.dock.length)),
      colStyle: { position: "absolute", right: "0", top: "84px", width: "132px", bottom: "66px",
                  display: "flex", flexDirection: "column", gap: "4px", zIndex: s.edit ? 6 : 1 },
      dockStyle: { display: "flex", gap: "4px", zIndex: s.edit ? 6 : 1 },
      platePrime: pad(4471 + (t % 29), 4) + "-" + pad(t % 97, 2),
      plateB: pad((t * 3) % 9999, 4) + "\u00b7" + pad(t % 61, 2),
      plateC: pad((t * 7) % 999, 3),
      bars: [62, 41, 88].map((v, i) => ({
        fill: { height: "7px", width: Math.max(8, Math.min(100, v + ((t * (i + 3)) % 17) - 8)) + "%",
                background: i === 2 ? "#C5678D" : "#A485F7" },
      })),
      statusLine: s.reason || ("SIM " + (21.4 + (t % 13) * 0.1).toFixed(1) + "ms · PKT " + ((t % 7) * 0.1).toFixed(1) + "% · FPS " + (58 - (t % 5))),
      tail: "AGENTS " + (11 + (t % 4)) + " · " + pad(t % 24, 2) + ":" + pad((t * 7) % 60, 2) + " SLT",
      holdStart: () => { this.lp = setTimeout(() => this.setState({ edit: true }), 480); },
      holdEnd: () => clearTimeout(this.lp),
      endEdit: () => this.setState({ edit: false }),
      addCol: () => this.setState(st => {
        const used = st.col.concat(st.dock);
        const miss = Object.keys(BTN).filter(k => used.indexOf(k) < 0);
        return miss.length ? { col: st.col.concat(miss[0]) } : { reason: "PALETTE EMPTY" };
      }),
    };
  }
}
</script>
</body>
</html>
