<?xml version="1.0" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="linkpoint-logo-animated" viewBox="0 0 512 580" width="100%" height="100%">
  <style>
    .top-crystal {
      animation: topCloseSequence 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .bot-crystal {
      animation: botCloseSequence 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .core-anim {
      transform-origin: 256px 256px;
      animation: corePulse 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Y-axis closing sequence */
    @keyframes topCloseSequence {
      0%, 15% { transform: translateY(0); }
      35%, 65% { transform: translateY(65px); }
      85%, 100% { transform: translateY(0); }
    }

    @keyframes botCloseSequence {
      0%, 15% { transform: translateY(0); }
      35%, 65% { transform: translateY(-65px); }
      85%, 100% { transform: translateY(0); }
    }

    @keyframes corePulse {
      0%, 25% { transform: scale(1); opacity: 0.8; }
      35%, 65% { transform: scale(0.6) rotate(180deg); opacity: 1; filter: drop-shadow(0 0 20px var(--pri, #2dd4bf)); }
      75%, 100% { transform: scale(1) rotate(0deg); opacity: 0.8; }
    }

    .logo-title {
      font-family: var(--dfont, 'JetBrains Mono', 'Open Sans', sans-serif);
      font-weight: 800;
      font-size: 38px;
      letter-spacing: 0.28em;
      fill: var(--pri, #2dd4bf);
    }
    .logo-subtitle {
      font-family: var(--font, 'JetBrains Mono', 'Open Sans', sans-serif);
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.38em;
      fill: var(--ink2, #a5b4fc);
    }
  </style>

  <defs>
    <!-- Base Gradients using CSS Theme Variables with defaults -->
    <linearGradient id="face1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--pri, #2dd4bf)" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="var(--priC, #0284c7)" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="face2Grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--sec2, #7c3aed)" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="var(--sec, #0369a1)" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="face3Grad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="var(--sec, #7c3aed)" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="var(--surf2, #312e81)" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="face4Grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--pri, #d946ef)" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="var(--sec2, #a21caf)" stop-opacity="0.8"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="var(--pri, #2dd4bf)" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="var(--sec, #0284c7)" stop-opacity="0"/>
    </radialGradient>

    <!-- Particle Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Path for Orbiting Particles -->
    <path id="orbitTrack" d="M 56 256 A 200 65 0 1 0 456 256 A 200 65 0 1 0 56 256"/>
  </defs>

  <!-- Minimalist Isometric Space Grid -->
  <g stroke="var(--outv, rgba(255,255,255,0.08))" stroke-width="1.5" fill="none" opacity="0.6">
    <polygon points="256,180 430,256 256,332 82,256"/>
    <polygon points="256,120 490,256 256,392 22,256"/>
    <line x1="256" y1="20" x2="256" y2="492" stroke-dasharray="4 6"/>
    <line x1="22" y1="256" x2="490" y2="256" stroke-dasharray="4 6"/>
  </g>

  <!-- Static Orbital Ring Path -->
  <ellipse cx="256" cy="256" rx="200" ry="65" fill="none" stroke="var(--sec2, #2dd4bf)" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 12"/>
  <ellipse cx="256" cy="256" rx="215" ry="72" fill="none" stroke="var(--outv, rgba(255, 255, 255, 0.1))" stroke-width="1"/>

  <!-- Orbiting Particles using native SMIL animateMotion -->
  <g>
    <circle r="4" fill="var(--pri, #2dd4bf)" filter="url(#glow)">
      <animateMotion dur="4s" repeatCount="indefinite" begin="0s">
        <mpath href="#orbitTrack"/>
      </animateMotion>
    </circle>
    <circle r="5" fill="var(--sec2, #a5b4fc)" filter="url(#glow)">
      <animateMotion dur="4s" repeatCount="indefinite" begin="-1.33s">
        <mpath href="#orbitTrack"/>
      </animateMotion>
    </circle>
    <circle r="3" fill="var(--sec, #d946ef)" filter="url(#glow)">
      <animateMotion dur="4s" repeatCount="indefinite" begin="-2.66s">
        <mpath href="#orbitTrack"/>
      </animateMotion>
    </circle>
  </g>

  <!-- TOP PYRAMID (True 3D SMIL Morphing Engine) -->
  <g class="top-crystal">
    <!-- Solid Base -->
    <polygon fill="var(--surf, rgba(15, 23, 42, 0.9))" stroke="var(--pri, #2dd4bf)" stroke-opacity="0.4" stroke-width="1.5">
      <animate attributeName="points" dur="4s" repeatCount="indefinite" calcMode="linear" values="392,170 256,220 120,170 256,120; &#10;                                352,205 160,205 160,135 352,135; &#10;                                256,220 120,170 256,120 392,170; &#10;                                160,205 160,135 352,135 352,205; &#10;                                120,170 256,120 392,170 256,220; &#10;                                160,135 352,135 352,205 160,205; &#10;                                256,120 392,170 256,220 120,170; &#10;                                352,135 352,205 160,205 160,135; &#10;                                392,170 256,220 120,170 256,120"/>
    </polygon>

    <!-- Face 1 -->
    <polygon fill="url(#face1Grad)" stroke="var(--ink, rgba(255,255,255,0.5))" stroke-width="1.5" stroke-linejoin="round" style="mix-blend-mode: screen;">
      <animate attributeName="points" dur="4s" repeatCount="indefinite" calcMode="linear" values="256,40 392,170 256,220; 256,40 352,205 160,205; 256,40 256,220 120,170; 256,40 160,205 160,135; 256,40 120,170 256,120; 256,40 160,135 352,135; 256,40 256,120 392,170; 256,40 352,135 352,205; 256,40 392,170 256,220"/>
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite" calcMode="linear" values="0.95; 0.95; 0.95; 0; 0; 0; 0; 0; 0.95"/>
    </polygon>

    <!-- Face 2 -->
    <polygon fill="url(#face2Grad)" stroke="var(--ink, rgba(255,255,255,0.5))" stroke-width="1.5" stroke-linejoin="round" style="mix-blend-mode: screen;">
      <animate attributeName="points" dur="4s" repeatCount="indefinite" calcMode="linear" values="256,40 256,220 120,170; 256,40 160,205 160,135; 256,40 120,170 256,120; 256,40 160,135 352,135; 256,40 256,120 392,170; 256,40 352,135 352,205; 256,40 392,170 256,220; 256,40 352,205 160,205; 256,40 256,220 120,170"/>
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite" calcMode="linear" values="0.95; 0; 0; 0; 0; 0; 0.95; 0.95; 0.95"/>
    </polygon>

    <!-- Face 3 -->
    <polygon fill="url(#face3Grad)" stroke="var(--ink2, rgba(255,255,255,0.3))" stroke-width="1" stroke-linejoin="round">
      <animate attributeName="points" dur="4s" repeatCount="indefinite" calcMode="linear" values="256,40 120,170 256,120; 256,40 160,135 352,135; 256,40 256,120 392,170; 256,40 352,135 352,205; 256,40 392,170 256,220; 256,40 352,205 160,205; 256,40 256,220 120,170; 256,40 160,205 160,135; 256,40 120,170 256,120"/>
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite" calcMode="linear" values="0; 0; 0; 0; 0.95; 0.95; 0.95; 0; 0"/>
    </polygon>

    <!-- Face 4 -->
    <polygon fill="url(#face4Grad)" stroke="var(--ink2, rgba(255,255,255,0.3))" stroke-width="1" stroke-linejoin="round">
      <animate attributeName="points" dur="4s" repeatCount="indefinite" calcMode="linear" values="256,40 256,120 392,170; 256,40 352,135 352,205; 256,40 392,170 256,220; 256,40 352,205 160,205; 256,40 256,220 120,170; 256,40 160,205 160,135; 256,40 120,170 256,120; 256,40 160,135 352,135; 256,40 256,120 392,170"/>
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite" calcMode="linear" values="0; 0; 0.95; 0.95; 0.95; 0; 0; 0; 0"/>
    </polygon>
  </g>

  <!-- BOTTOM PYRAMID (True 3D SMIL Morphing Engine - Offset Y) -->
  <g class="bot-crystal">
    <!-- Solid Base -->
    <polygon fill="var(--surf, rgba(15, 23, 42, 0.9))" stroke="var(--sec, #d946ef)" stroke-opacity="0.4" stroke-width="1.5">
      <animate attributeName="points" dur="4s" repeatCount="indefinite" calcMode="linear" values="392,342 256,392 120,342 256,292; &#10;                                352,377 160,377 160,307 352,307; &#10;                                256,392 120,342 256,292 392,342; &#10;                                160,377 160,307 352,307 352,377; &#10;                                120,342 256,292 392,342 256,392; &#10;                                160,307 352,307 352,377 160,377; &#10;                                256,292 392,342 256,392 120,342; &#10;                                352,307 352,377 160,377 160,307; &#10;                                392,342 256,392 120,342 256,292"/>
    </polygon>

    <polygon fill="url(#face4Grad)" stroke="var(--ink, rgba(255,255,255,0.5))" stroke-width="1.5" stroke-linejoin="round" style="mix-blend-mode: screen;">
      <animate attributeName="points" dur="4s" repeatCount="indefinite" calcMode="linear" values="256,472 392,342 256,392; 256,472 352,377 160,377; 256,472 256,392 120,342; 256,472 160,377 160,307; 256,472 120,342 256,292; 256,472 160,307 352,307; 256,472 256,292 392,342; 256,472 352,307 352,377; 256,472 392,342 256,392"/>
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite" calcMode="linear" values="0.95; 0.95; 0.95; 0; 0; 0; 0; 0; 0.95"/>
    </polygon>

    <polygon fill="url(#face3Grad)" stroke="var(--ink, rgba(255,255,255,0.5))" stroke-width="1.5" stroke-linejoin="round" style="mix-blend-mode: screen;">
      <animate attributeName="points" dur="4s" repeatCount="indefinite" calcMode="linear" values="256,472 256,392 120,342; 256,472 160,377 160,307; 256,472 120,342 256,292; 256,472 160,307 352,307; 256,472 256,292 392,342; 256,472 352,307 352,377; 256,472 392,342 256,392; 256,472 352,377 160,377; 256,472 256,392 120,342"/>
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite" calcMode="linear" values="0.95; 0; 0; 0; 0; 0; 0.95; 0.95; 0.95"/>
    </polygon>

    <polygon fill="url(#face1Grad)" stroke="var(--ink2, rgba(255,255,255,0.3))" stroke-width="1" stroke-linejoin="round">
      <animate attributeName="points" dur="4s" repeatCount="indefinite" calcMode="linear" values="256,472 120,342 256,292; 256,472 160,307 352,307; 256,472 256,292 392,342; 256,472 352,307 352,377; 256,472 392,342 256,392; 256,472 352,377 160,377; 256,472 256,392 120,342; 256,472 160,377 160,307; 256,472 120,342 256,292"/>
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite" calcMode="linear" values="0; 0; 0; 0; 0.95; 0.95; 0.95; 0; 0"/>
    </polygon>

    <polygon fill="url(#face2Grad)" stroke="var(--ink2, rgba(255,255,255,0.3))" stroke-width="1" stroke-linejoin="round">
      <animate attributeName="points" dur="4s" repeatCount="indefinite" calcMode="linear" values="256,472 256,292 392,342; 256,472 352,307 352,377; 256,472 392,342 256,392; 256,472 352,377 160,377; 256,472 256,392 120,342; 256,472 160,307 160,337; 256,472 120,342 256,292; 256,472 160,307 352,307; 256,472 256,292 392,342"/>
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite" calcMode="linear" values="0; 0; 0.95; 0.95; 0.95; 0; 0; 0; 0"/>
    </polygon>
  </g>

  <!-- CORE NODE -->
  <g class="core-anim">
    <circle cx="256" cy="256" r="45" fill="url(#coreGlow)"/>
    <polygon points="256,242 270,256 256,270 242,256" fill="var(--ink, #ffffff)"/>
  </g>

  <!-- TITLE TYPOGRAPHY BENEATH -->
  <g transform="translate(0, 522)">
    <text x="256" y="0" text-anchor="middle" class="logo-title">LINKPOINT</text>
    <text x="256" y="28" text-anchor="middle" class="logo-subtitle">SECONDLIFE COMMUNICATOR</text>
  </g>

</svg>
